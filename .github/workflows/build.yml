name: build-apk

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          sudo apt-get update
          pip install --upgrade pip
          pip install buildozer cython

      - name: Pre-accept Android licenses for buildozer SDK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\n" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf "d56f5187479451eabf01fb78af6dfcb131a6481e\n" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: io-apk
          path: bin/*.apk
